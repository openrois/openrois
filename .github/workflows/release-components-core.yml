name: Release components core

# Publishes openrois-components-core to PyPI when a components-core-v* tag is pushed, for
# example components-core-v0.1.0-alpha.2. PyPI uses trusted publishing (OIDC), so no
# long-lived token is stored in the repository.
# The last job then creates the GitHub release with the wheel and the CHANGELOG section.

on:
  push:
    tags: ["components-core-v*"]

permissions:
  contents: read

concurrency:
  group: release-components-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with pyproject.toml
        id: versions
        # The tag carries the npm form (0.1.0-alpha.2), and PyPI normalizes it to 0.1.0a2.
        # beta and rc tags normalize the same way. A tag in the PyPI form (0.1.0a2) would
        # also equal pyproject.toml, and the GitHub release would then be a full release,
        # because the release action reads a pre-release from a hyphen. So the form comes
        # first, and it refuses any other label too.
        run: |
          tag="${GITHUB_REF_NAME#components-core-v}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag $tag is not in the npm form, for example 0.1.0-alpha.1"
            exit 1
          fi
          py_version=$(python3 -c "import tomllib;print(tomllib.load(open('components/core/pyproject.toml','rb'))['project']['version'])")
          py_expected=$(sed -E -e 's/-alpha\./a/' -e 's/-beta\./b/' -e 's/-rc\./rc/' <<< "$tag")
          if [ "$py_version" != "$py_expected" ]; then
            echo "::error::Tag $tag, PyPI $py_version (expected $py_expected)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "pypi=$py_version" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        # This runs before anything is uploaded, so a missing CHANGELOG section stops the
        # release while the version is still free on PyPI.
        env:
          PY_VERSION: ${{ steps.versions.outputs.pypi }}
        run: python3 .github/scripts/release_notes.py --part components/core/CHANGELOG.md "$PY_VERSION" > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        # The interfaces come from PyPI, and so does the engine the tests run components in.
        run: python -m pip install -e "components/core[dev]"

      - name: Lint
        working-directory: components/core
        run: ruff check src/ tests/

      - name: Type check
        working-directory: components/core
        run: mypy

      - name: Test
        working-directory: components/core
        run: pytest

      - name: Build
        working-directory: components/core
        run: |
          python -m pip install build
          python -m build

      - name: The wheel installs from PyPI
        # This resolves openrois-interfaces from the registry, so a floor that PyPI
        # cannot satisfy stops the release before anything is uploaded.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install components/core/dist/*.whl
          /tmp/clean/bin/python -c "import openrois.components.core"

      # The release carries the wheel that passed the clean install. It is stored before the
      # publish, and the sdist stays on PyPI.
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: components/core/dist/*.whl
          if-no-files-found: error

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: components/core/dist

  github-release:
    name: GitHub release
    needs: [check-version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: ./.github/actions/github-release
        with:
          title: Components Core ${{ needs.check-version.outputs.version }}
          notes-file: artifacts/release-notes/release-notes.md
          files: artifacts/wheel/*.whl
