name: Python

# The Python engine, gateway and component packages. The interfaces workflow covers the
# types they build on, and the conformance workflow runs them together.

on:
  push:
    branches: [dev, main]
    paths:
      - "interfaces/python/**"
      - "interfaces/schema/**"
      - "components/**"
      - "engine/**"
      - "services/gateway/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "interfaces/python/**"
      - "interfaces/schema/**"
      - "components/**"
      - "engine/**"
      - "services/gateway/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        # The interfaces and openrois-components-core come from PyPI.
        run: python -m pip install -e "engine[dev]"

      - name: Lint
        working-directory: engine
        run: ruff check src/ tests/

      - name: Type check
        working-directory: engine
        run: mypy

      - name: Test
        working-directory: engine
        run: pytest

  components:
    name: Components ${{ matrix.package }}, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        package: [core, common]
        include:
          # The OpenRoIS packages each one needs from the tree. The rest come from
          # PyPI: the core tests run components in openrois-engine, against a stand-in
          # for rclpy.
          - package: core
            needs-packages: ""
          - package: common
            needs-packages: -e interfaces/python -e components/core
    defaults:
      run:
        working-directory: components/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: components/${{ matrix.package }}/pyproject.toml

      - name: Install
        working-directory: .
        run: python -m pip install ${{ matrix.needs-packages }} -e "components/${{ matrix.package }}[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  gateway:
    name: Gateway, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/gateway/pyproject.toml

      - name: Install
        run: python -m pip install -e interfaces/python -e engine -e "services/gateway[dev]"

      - name: Lint
        working-directory: services/gateway
        run: ruff check src/ tests/

      - name: Type check
        working-directory: services/gateway
        run: mypy

      - name: Test
        working-directory: services/gateway
        run: pytest
