name: Python

# The Python engine, gateway, component packages and MCP server. The interfaces workflow
# covers the types they build on, and the conformance workflow runs them together.

on:
  push:
    branches: [dev, main]
    paths:
      - "interfaces/python/**"
      - "interfaces/schema/**"
      - "components/**"
      - "engine/**"
      - "services/gateway/**"
      - "services/mcp/**"
      - "sdk/python/**"
      - "testing/mock-adapter/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "interfaces/python/**"
      - "interfaces/schema/**"
      - "components/**"
      - "engine/**"
      - "services/gateway/**"
      - "services/mcp/**"
      - "sdk/python/**"
      - "testing/mock-adapter/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        # The interfaces and openrois-components-core come from PyPI.
        run: python -m pip install -e "engine[dev]"

      - name: Lint
        working-directory: engine
        run: ruff check src/ tests/

      - name: Type check
        working-directory: engine
        run: mypy

      - name: Test
        working-directory: engine
        run: pytest

  components:
    name: Components ${{ matrix.package }}, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        package: [core, common]
        include:
          # The OpenRoIS packages each one needs from the tree. The rest come from
          # PyPI: the core tests run components in openrois-engine, against a stand-in
          # for rclpy.
          - package: core
            needs-packages: ""
          - package: common
            needs-packages: -e interfaces/python -e components/core
    defaults:
      run:
        working-directory: components/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: components/${{ matrix.package }}/pyproject.toml

      - name: Install
        working-directory: .
        run: python -m pip install ${{ matrix.needs-packages }} -e "components/${{ matrix.package }}[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  gateway:
    name: Gateway, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/gateway/pyproject.toml

      - name: Install
        run: python -m pip install -e interfaces/python -e engine -e "services/gateway[dev]"

      - name: Lint
        working-directory: services/gateway
        run: ruff check src/ tests/

      - name: Type check
        working-directory: services/gateway
        run: mypy

      - name: Test
        working-directory: services/gateway
        run: pytest

  mcp:
    # The MCP server is a client of the Python SDK, so it runs against a stack from the tree,
    # as the SDK does: a change to the SDK, the engine or the gateway that breaks it fails in
    # its own pull request. The integration tests drive every tool through the MCP client,
    # in process and through the console script over stdio.
    name: MCP server, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      OPENROIS_GATEWAY_URL: ws://127.0.0.1:8765
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            interfaces/python/pyproject.toml
            engine/pyproject.toml
            components/core/pyproject.toml
            components/common/pyproject.toml
            services/gateway/pyproject.toml
            sdk/python/pyproject.toml
            services/mcp/pyproject.toml

      - name: Install the stack, the SDK and the server
        working-directory: .
        run: >-
          python -m pip install
          -e interfaces/python -e engine -e components/core -e components/common
          -e services/gateway -e sdk/python -e "services/mcp[dev]"

      - name: Start the gateway and the mock adapter
        # They stay up for the steps below. The suite waits until the adapter has joined.
        working-directory: .
        run: |
          openrois-gateway --log-level warning > gateway.log 2>&1 &
          python testing/mock-adapter/mock_adapter.py \
            --config testing/mock-adapter/adapter.fast.yaml --log-level warning \
            > adapter.log 2>&1 &

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy

      - name: Test
        # The unit tests, then the integration tests, which OPENROIS_GATEWAY_URL turns on.
        run: pytest

      - name: Logs
        if: always()
        working-directory: .
        run: cat gateway.log adapter.log
