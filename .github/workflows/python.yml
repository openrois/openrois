name: Python

# The Python engine, gateway and component packages, and the gateway with the mock
# adapter in Docker Compose, with the TypeScript SDK as its client. The interfaces
# workflow covers the types they build on.

on:
  push:
    branches: [dev, main]
    paths:
      - "interfaces/python/**"
      - "interfaces/schema/**"
      - "interfaces/typescript/**"
      - "components/**"
      - "engine/**"
      - "gateway/**"
      - "examples/mock-adapter/**"
      - "sdk/typescript/**"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "interfaces/python/**"
      - "interfaces/schema/**"
      - "interfaces/typescript/**"
      - "components/**"
      - "engine/**"
      - "gateway/**"
      - "examples/mock-adapter/**"
      - "sdk/typescript/**"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        # The OpenRoIS packages are not on PyPI yet, so they install from the tree.
        run: python -m pip install -e interfaces/python -e components/core -e "engine[dev]"

      - name: Lint
        working-directory: engine
        run: ruff check src/ tests/

      - name: Type check
        working-directory: engine
        run: mypy

      - name: Test
        working-directory: engine
        run: pytest

  components:
    name: Components ${{ matrix.package }}, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        package: [core, common, kachaka]
        include:
          # The OpenRoIS packages each one needs, installed from the tree. The Kachaka
          # tests run its components in an engine, against stand-ins for the gRPC API
          # and rclpy.
          - package: core
            needs-packages: -e interfaces/python
          - package: common
            needs-packages: -e interfaces/python -e components/core
          - package: kachaka
            needs-packages: -e interfaces/python -e components/core -e engine
    defaults:
      run:
        working-directory: components/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: components/${{ matrix.package }}/pyproject.toml

      - name: Install
        working-directory: .
        run: python -m pip install ${{ matrix.needs-packages }} -e "components/${{ matrix.package }}[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  gateway:
    name: Gateway, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: gateway/pyproject.toml

      - name: Install
        run: python -m pip install -e interfaces/python -e engine -e "gateway[dev]"

      - name: Lint
        working-directory: gateway
        run: ruff check src/ tests/ scripts/

      - name: Type check
        working-directory: gateway
        run: mypy

      - name: Test
        working-directory: gateway
        run: pytest

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [engine, components, gateway]
    env:
      # The mock adapter simulates its work ten times faster than in real time.
      OPENROIS_MOCK_TIME_SCALE: "0.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            interfaces/typescript/package-lock.json
            sdk/typescript/package-lock.json

      - name: Start the gateway and the mock adapter
        run: docker compose up --build --detach

      - name: Smoke test
        run: |
          python -m pip install websockets
          python gateway/scripts/smoke.py --timeout 120

      - name: Install the TypeScript SDK
        # The SDK depends on the TypeScript interfaces in the tree, which are built
        # first.
        run: |
          (cd interfaces/typescript && npm ci && npm run build)
          (cd sdk/typescript && npm ci)

      - name: SDK sessions against the gateway
        working-directory: sdk/typescript
        env:
          OPENROIS_GATEWAY_URL: ws://127.0.0.1:8765
        run: npx vitest run tests/gateway.test.ts

      - name: Stop gracefully
        # The gateway runs as the container's main process and must handle SIGTERM
        # itself, so a clean stop shows as exit code 0.
        run: |
          docker compose stop --timeout 10
          code="$(docker compose ps --all --format '{{.ExitCode}}' gateway)"
          if [ "$code" != "0" ]; then
            echo "::error::The gateway exited with code $code after SIGTERM."
            exit 1
          fi

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Remove the stack
        if: always()
        run: docker compose down --volumes