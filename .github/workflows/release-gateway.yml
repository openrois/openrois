name: Release gateway

# Publishes openrois-gateway to PyPI when a gateway-v* tag is pushed, for example
# gateway-v0.1.0-alpha.2. PyPI uses trusted publishing (OIDC), so no long-lived token is
# stored in the repository.

on:
  push:
    tags: ["gateway-v*"]

permissions:
  contents: read

concurrency:
  group: release-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with pyproject.toml
        # The tag carries the npm form (0.1.0-alpha.2), and PyPI normalizes it to
        # 0.1.0a2, as for the interfaces tags.
        run: |
          tag="${GITHUB_REF_NAME#gateway-v}"
          py_version=$(python3 -c "import tomllib;print(tomllib.load(open('services/gateway/pyproject.toml','rb'))['project']['version'])")
          py_expected=$(python3 -c "import re,sys;print(re.sub(r'-alpha\.', 'a', sys.argv[1]))" "$tag")
          if [ "$py_version" != "$py_expected" ]; then
            echo "::error::Tag $tag, PyPI $py_version (expected $py_expected)"
            exit 1
          fi

  pypi:
    name: PyPI
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        # The engine and the interfaces come from PyPI.
        run: python -m pip install -e "services/gateway[dev]"

      - name: Lint
        working-directory: services/gateway
        run: ruff check src/ tests/

      - name: Type check
        working-directory: services/gateway
        run: mypy

      - name: Test
        working-directory: services/gateway
        run: pytest

      - name: Build
        working-directory: services/gateway
        run: |
          python -m pip install build
          python -m build

      - name: The wheel installs from PyPI
        # This resolves openrois-engine from the registry, so a floor that PyPI
        # cannot satisfy stops the release before anything is uploaded.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install services/gateway/dist/*.whl
          /tmp/clean/bin/python -c "import openrois.gateway"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: services/gateway/dist
