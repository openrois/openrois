[project]
name = "openrois-components-reachy-mini"
version = "0.1.0"
description = "OpenRoIS components for the Reachy Mini robot"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openrois-sdk",
    "openrois-components-common",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["openrois_components.*"]