[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrois-components-core"
version = "0.1.0a3"
description = "OpenRoIS component framework: decorators, metadata, result builders"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openrois-interfaces>=0.1.0a3",
]

[project.optional-dependencies]
dev = [
    "openrois-core",
    "openrois-components-common",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["openrois_components_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"