[project]
name = "openrois-components-common"
version = "0.1.0"
description = "Common component helpers and reference components for OpenRoIS adapters"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["openrois-sdk"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["openrois_components.*"]