# OpenRoIS local development environment.
#
# Usage: docker compose up
#
# Services:
#   gateway  - OpenRoIS Gateway (WebSocket server on port 8765)
#   hub      - Web dashboard (Vite dev server, connects to gateway)
#   adapter  - Mock adapter (registers canned components with gateway)
#
# The hub is accessible at http://localhost:3000.
# The gateway WebSocket is at ws://localhost:8765.

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8765:8765"
    environment:
      - ENGINE_HOST=0.0.0.0
      - ENGINE_PORT=8765
    restart: unless-stopped

  hub:
    build:
      context: ./hub
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

