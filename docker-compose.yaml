# OpenRoIS local development environment.
#
# Usage: docker compose up
#
# Services:
#   gateway  - OpenRoIS gateway, the Python openrois-core process (WebSocket on 8765)
#   hub      - Management application (not started yet, scaffold only)
#   adapter  - Mock adapter (registers canned components with gateway)
#
# The gateway WebSocket is at ws://localhost:8765.
# The hub is served at http://localhost:3000, but it contains no OpenRoIS code
# yet. To inspect a running gateway today, use examples/hri-client instead.

services:
  gateway:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "8765:8765"
    environment:
      - OPENROIS_HOST=0.0.0.0
      - OPENROIS_PORT=8765
    # Uncomment to configure the gateway from a file (auth, TLS, engine id, ...):
    # volumes:
    #   - ./gateway.yaml:/etc/openrois/gateway.yaml:ro
    restart: unless-stopped

  hub:
    build:
      context: ./apps/hub
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

