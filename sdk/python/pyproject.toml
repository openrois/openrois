[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrois-sdk"
version = "0.1.0"
description = "Python client SDK for the OpenRoIS middleware"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "OpenRoIS Community" },
]
requires-python = ">=3.12"
keywords = ["rois", "omg", "robotics", "hri", "middleware", "sdk", "json-rpc", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openrois-interfaces>=0.1.0,<0.2",
    "pydantic>=2.10",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://openrois.org/"
Repository = "https://github.com/openrois/openrois"
"Bug-Tracker" = "https://github.com/openrois/openrois/issues"

# openrois is a namespace package shared with openrois-interfaces, so there is no
# src/openrois/__init__.py and this distribution ships only openrois/sdk/.
[tool.hatch.build.targets.wheel]
packages = ["src/openrois"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests"]
# The openrois namespace package has no __init__.py at its root, so mypy resolves
# openrois.sdk from src/ as an explicit package base.
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
