[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrois-adapter-sdk"
version = "0.1.0a2"
description = "Python SDK for building OpenRoIS adapters"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "OpenRoIS Community" },
]
keywords = ["rois", "omg", "robotics", "hri", "middleware", "adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openrois-interfaces>=0.1.0a2",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://openrois.org/"
Repository = "https://github.com/openrois/openrois"
"Bug-Tracker" = "https://github.com/openrois/openrois/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openrois"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
