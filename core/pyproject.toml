[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrois-core"
version = "0.1.0a2"
description = "OpenRoIS core: recursive Engine, WebSocket server and client"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openrois-interfaces>=0.1.0a2",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openrois_core*"]