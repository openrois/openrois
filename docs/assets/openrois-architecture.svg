<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="t d">
  <title id="t">OpenRoIS architecture</title>
  <desc id="d">Four rows. Service Application: a web application with the TypeScript SDK and a Unity application with the C# SDK. Main HRI Engine: the gateway process with the main engine and its child engine registry, a profile aggregator, a component allocator for bind and release, and authentication with JWT and RBAC, which is planned. Sub HRI Engines: a robot adapter, an avatar adapter, and a service adapter, each with a sub engine and a component registry. Implementation Layer: a ROS 2 robot, a virtual avatar in a Unity runtime, and cloud services. Service applications reach the gateway over WebSocket with JSON-RPC 2.0 and the five RoIS interfaces. The gateway reaches adapters over the same transport with the five-method Component Contract. Adapters reach their hosts over ROS 2, IPC, or gRPC. Media flows over WebRTC on a separate data plane, outside RoIS scope. At build time, Python Pydantic models are exported to JSON Schema and generated into C# and TypeScript types, drift-checked against the normative RoIS files.</desc>
